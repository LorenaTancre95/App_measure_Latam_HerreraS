name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Gerar projeto iOS nativo (prebuild)
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Patch Podfile
        run: |
          python3 - << 'PYEOF'
          with open('ios/Podfile', 'r') as f:
              content = f.read()

          patch = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                config.build_settings['OTHER_SWIFT_FLAGS'] = '$(inherited) -strict-concurrency=minimal'
              end
            end
          """

          content = content.replace('post_install do |installer|',
                                    'post_install do |installer|\n' + patch, 1)

          with open('ios/Podfile', 'w') as f:
              f.write(content)

          print('Podfile patched OK')
          PYEOF

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          NO_FLIPPER: 1

      - name: Compilar app (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/MedidorCaixas.xcworkspace \
            -scheme MedidorCaixas \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/build.log

      - name: Mostrar erros reais se falhou
        if: failure()
        run: |
          echo "====== ERROS DE COMPILAÇÃO ======"
          grep -E "^/.+:[0-9]+:[0-9]+: error:" /tmp/build.log | head -40 || true
          echo ""
          echo "====== ÚLTIMAS 50 LINHAS ======"
          tail -50 /tmp/build.log

      - name: Verificar output e empacotar IPA
        run: |
          DERIVED="$RUNNER_TEMP/DerivedData"
          PRODUCTS="$DERIVED/Build/Products/Release-iphoneos"

          echo "=== Buscando .app em: $PRODUCTS ==="
          ls -la "$PRODUCTS" 2>/dev/null || {
            echo "Products dir não encontrado. Buscando em todo DerivedData..."
            find "$DERIVED" -name "*.app" -type d 2>/dev/null | grep -v "/Pods/" | head -10
            exit 1
          }

          APP_PATH=$(find "$PRODUCTS" -name "*.app" -maxdepth 1 -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERRO: .app não encontrado em $PRODUCTS"
            find "$PRODUCTS" -maxdepth 3 2>/dev/null | head -30
            exit 1
          fi

          BINARY_NAME=$(basename "$APP_PATH" .app)
          BINARY_PATH="$APP_PATH/$BINARY_NAME"

          echo "App: $APP_PATH"
          echo "Conteúdo do .app:"
          ls -la "$APP_PATH/"

          # Se o binary não está no .app, buscar nos Intermediates e copiar
          if [ ! -f "$BINARY_PATH" ]; then
            echo ""
            echo "Binary ausente no .app — buscando em Intermediates..."
            INTERMEDIATES="$DERIVED/Build/Intermediates.noindex"
            while IFS= read -r candidate; do
              if file "$candidate" 2>/dev/null | grep -qi "mach-o"; then
                echo "Copiando binary de: $candidate"
                cp "$candidate" "$BINARY_PATH"
                chmod +x "$BINARY_PATH"
                break
              fi
            done < <(find "$INTERMEDIATES" -name "$BINARY_NAME" \
              -not -name "*.o" -not -name "*.d" -not -name "*.dia" \
              2>/dev/null | head -10)
          fi

          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERRO: Binary não encontrado nem em Products nem em Intermediates"
            exit 1
          fi

          echo "Binary OK: $(ls -lh "$BINARY_PATH")"

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/MedidorCaixas.app"
          cd "$RUNNER_TEMP"
          zip -r MedidorCaixas.ipa Payload/
          ls -lh MedidorCaixas.ipa
          echo "IPA criado com sucesso!"

      - name: Upload IPA como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MedidorCaixas-iOS
          path: ${{ runner.temp }}/MedidorCaixas.ipa
          retention-days: 30
