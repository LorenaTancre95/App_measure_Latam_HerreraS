name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── Build completo Xcode ──────────────────────────────────────────────────
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Garantir expo-module.config.json em node_modules antes do prebuild
        run: |
          echo "=== node_modules/lidar-box-measure ==="
          ls -la node_modules/lidar-box-measure/ || echo "DIR NAO ENCONTRADO"
          if [ ! -f "node_modules/lidar-box-measure/expo-module.config.json" ]; then
            echo "COPIANDO expo-module.config.json para node_modules..."
            cp modules/lidar-box-measure/expo-module.config.json node_modules/lidar-box-measure/
          fi
          cat node_modules/lidar-box-measure/expo-module.config.json

      - name: Instalar Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Patch expo-font (Color → UIColor para expo-modules-core 1.12)
        run: |
          python3 - << 'PYEOF'
          # FontUtilsRecords.swift usa SwiftUI Color que não conforma AnyArgument em 1.12
          # FontUtilsModule.swift converte via UIColor(options.color)
          # Fix: trocar Color por UIColor em ambos

          import sys

          records = 'node_modules/expo-font/ios/FontUtilsRecords.swift'
          with open(records) as f:
              c = f.read()
          c = c.replace('import SwiftUI', 'import UIKit')
          c = c.replace('@Field var color: Color = .black', '@Field var color: UIColor = .black')
          with open(records, 'w') as f:
              f.write(c)
          if 'UIColor' not in c:
              raise RuntimeError('patch FontUtilsRecords.swift falhou')
          print('FontUtilsRecords.swift OK')

          module = 'node_modules/expo-font/ios/FontUtilsModule.swift'
          with open(module) as f:
              c = f.read()
          c = c.replace('UIColor(options.color)', 'options.color')
          with open(module, 'w') as f:
              f.write(c)
          print('FontUtilsModule.swift OK')
          PYEOF

      - name: Gerar projeto iOS nativo (prebuild)
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Diagnosticar e forçar registro do LidarBoxMeasureModule
        run: |
          python3 - << 'PYEOF'
          import glob, re, os

          # ── 1. ExpoModulesProvider.swift ──────────────────────────────────────
          providers = glob.glob('ios/**/ExpoModulesProvider.swift', recursive=True)
          if not providers:
              print('ERROR: ExpoModulesProvider.swift nao encontrado!')
          else:
              path = providers[0]
              with open(path) as f:
                  content = f.read()
              print(f'=== {path} ===')
              print(content)
              print('=== FIM ===')

              if 'LidarBoxMeasureModule' not in content:
                  print('PATCH: LidarBoxMeasureModule ausente — adicionando...')
                  # Add import after ExpoModulesCore
                  if '@_implementationOnly import LidarBoxMeasure' not in content:
                      content = content.replace(
                          'import ExpoModulesCore',
                          'import ExpoModulesCore\n@_implementationOnly import LidarBoxMeasure'
                      )
                  # Add to getModuleClasses return list
                  content = re.sub(
                      r'(func getModuleClasses.*?return \[)',
                      r'\1\n      LidarBoxMeasureModule.self,',
                      content, count=1, flags=re.DOTALL
                  )
                  with open(path, 'w') as f:
                      f.write(content)
                  print('PATCH ExpoModulesProvider.swift OK')
              else:
                  print('LidarBoxMeasureModule ja esta no provider OK')

          # ── 2. Podfile ────────────────────────────────────────────────────────
          with open('ios/Podfile') as f:
              podfile = f.read()
          lidar_lines = [l for l in podfile.splitlines() if 'lidar' in l.lower() or 'LidarBox' in l]
          print(f'Linhas LiDAR no Podfile: {lidar_lines}')

          if 'LidarBoxMeasure' not in podfile:
              print('PATCH Podfile: pod LidarBoxMeasure ausente — adicionando...')
              podfile = re.sub(
                  r'(use_expo_modules!)',
                  r"\1\n  pod 'LidarBoxMeasure', :path => '../modules/lidar-box-measure'",
                  podfile, count=1
              )
              with open('ios/Podfile', 'w') as f:
                  f.write(podfile)
              print('PATCH Podfile OK')
          else:
              print('LidarBoxMeasure ja esta no Podfile OK')
          PYEOF

      - name: Garantir permissões de câmera no Info.plist
        run: |
          PLIST="ios/MedidorCaixas/Info.plist"
          add_if_missing() {
            local key="$1" val="$2"
            if ! /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Add :$key string '$val'" "$PLIST"
              echo "Adicionado: $key"
            else
              echo "Já existe: $key"
            fi
          }
          add_if_missing NSCameraUsageDescription "Necessário para medir caixas com LiDAR"
          add_if_missing NSMotionUsageDescription "Necessário para rastreamento e medição 3D"

      - name: Patch Podfile
        run: |
          python3 - << 'PYEOF'
          with open('ios/Podfile', 'r') as f:
              content = f.read()

          SEARCH = 'post_install do |installer|'
          if SEARCH not in content:
              raise RuntimeError('ERRO: post_install block nao encontrado no Podfile!\n' + content[:500])

          patch = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                config.build_settings['SWIFT_VERSION'] = '5.0'
                config.build_settings['SWIFT_STRICT_CONCURRENCY'] = 'minimal'
                config.build_settings['OTHER_SWIFT_FLAGS'] = '$(inherited) -strict-concurrency=minimal'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
              end
            end
          """

          content = content.replace(SEARCH, SEARCH + '\n' + patch, 1)

          with open('ios/Podfile', 'w') as f:
              f.write(content)

          if 'SWIFT_STRICT_CONCURRENCY' not in content:
              raise RuntimeError('ERRO: patch nao foi aplicado no Podfile!')

          print('Podfile patched OK')
          PYEOF

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          NO_FLIPPER: 1

      - name: Patch final — ExpoModulesProvider + desabilitar run script Xcode
        run: |
          python3 - << 'PYEOF'
          import glob, re

          # ── 1. ExpoModulesProvider.swift ─────────────────────────────────────
          providers = glob.glob('ios/**/ExpoModulesProvider.swift', recursive=True)
          if not providers:
              raise RuntimeError('ExpoModulesProvider.swift nao encontrado!')

          path = providers[0]
          with open(path) as f:
              content = f.read()
          print(f'=== {path} (ANTES) ===\n{content}\n=== FIM ===')

          if 'LidarBoxMeasureModule' not in content:
              print('PATCH: adicionando LidarBoxMeasureModule...')
              if '@_implementationOnly import LidarBoxMeasure' not in content:
                  content = content.replace(
                      'import ExpoModulesCore',
                      'import ExpoModulesCore\n@_implementationOnly import LidarBoxMeasure'
                  )
              content = re.sub(
                  r'(func getModuleClasses.*?return \[)',
                  r'\1\n      LidarBoxMeasureModule.self,',
                  content, count=1, flags=re.DOTALL
              )
              with open(path, 'w') as f:
                  f.write(content)
              print('PATCH ExpoModulesProvider.swift OK')
          else:
              print('LidarBoxMeasureModule ja esta no provider')

          # ── 2. Desabilitar run script que regenera ExpoModulesProvider ───────
          pbx_path = 'ios/MedidorCaixas.xcodeproj/project.pbxproj'
          with open(pbx_path) as f:
              pbx = f.read()

          original = pbx
          # Encontrar shellScript que contém 'generate' ou 'ExpoModulesProvider'
          # No .pbxproj o conteúdo usa \" e \n como escape
          pbx = re.sub(
              r'shellScript = "((?:[^"\\]|\\.)*(?:generate|ExpoModulesProvider)(?:[^"\\]|\\.)*)"',
              r'shellScript = "echo \\"provider pre-patched, skipping generate\\""',
              pbx
          )
          if pbx != original:
              with open(pbx_path, 'w') as f:
                  f.write(pbx)
              print('Run script generator desabilitado no project.pbxproj OK')
          else:
              print('AVISO: run script generator nao encontrado no pbxproj')
          PYEOF

      - name: Compilar app (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/MedidorCaixas.xcworkspace \
            -scheme MedidorCaixas \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/result.xcresult" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_NSCameraUsageDescription="Necessário para medir caixas com LiDAR" \
            INFOPLIST_KEY_NSMotionUsageDescription="Necessário para rastreamento e medição 3D" \
            2>&1 | tee /tmp/build.log || {
            echo ""
            echo "=========================================="
            echo "ERROS SWIFT:"
            echo "=========================================="
            grep -E '\.swift:[0-9]+:[0-9]+: error:' /tmp/build.log | head -30 || true
            echo "=========================================="
            exit 1
          }

      - name: Mostrar erros reais se falhou
        if: failure()
        run: |
          echo "====== ERROS SWIFT (grep direto no log) ======"
          grep -n "error:" /tmp/build.log \
            | grep -v "^[^:]*:[^:]*: note:\|^[^:]*:[^:]*: warning:" \
            | grep -v "WARN\|warn\|StrictConcurrency\|deprecated" \
            | head -80 || true

          echo ""
          echo "====== ERROS DO XCRESULT ======"
          xcrun xcresulttool get \
            --path "$RUNNER_TEMP/result.xcresult" \
            --format json 2>/dev/null | python3 - << 'PYEOF'
          import sys, json

          def extract(obj):
              if isinstance(obj, dict):
                  t = obj.get('_type', {}).get('_name', '')
                  if t in ('IssueSummary', 'ResultIssueSummary'):
                      msg = obj.get('message', {}).get('_value', '')
                      url = obj.get('documentURL', {}).get('_value', '')
                      sev = obj.get('issueType', {}).get('_value', 'error')
                      print(f"[{sev}] {msg}")
                      if url:
                          print(f"       {url}")
                  for v in obj.values():
                      extract(v)
              elif isinstance(obj, list):
                  for item in obj:
                      extract(item)

          try:
              data = json.load(sys.stdin)
              extract(data)
          except Exception as e:
              print(f"xcresult parse error: {e}")
          PYEOF

          echo ""
          echo "====== ERROS NO LOG (fallback) ======"
          grep -E '\.swift:[0-9]+:[0-9]+: error:|\.m:[0-9]+:[0-9]+: error:' /tmp/build.log | head -40 || true
          echo ""
          echo "====== .dia FILES DE ExpoFont ======"
          find "$RUNNER_TEMP/DerivedData" -name "*.dia" 2>/dev/null \
            | grep -i "expo\|font\|Font" | head -10 | while read f; do
            echo "--- $f ---"
            python3 - "$f" << 'DIAEOF'
          import sys, struct

          # Minimal LLVM serialized diagnostics reader
          # Records start with RecordCode. Code 2 = DIAG
          with open(sys.argv[1], 'rb') as fh:
              magic = fh.read(4)
              if magic != b'DIAG':
                  print("  (not a .dia file or different format)")
                  sys.exit(0)
              content = fh.read()
          # Look for UTF-8 text segments (crude but works for messages)
          import re
          for m in re.finditer(rb'[\x20-\x7e]{20,}', content):
              s = m.group().decode('ascii', errors='replace')
              if 'error' in s.lower() or '.swift' in s or '.m:' in s:
                  print(' ', s)
          DIAEOF
          done || true
          echo ""
          echo "====== ÚLTIMAS 60 LINHAS DO LOG ======"
          tail -60 /tmp/build.log

      - name: Verificar output e empacotar IPA
        run: |
          DERIVED="$RUNNER_TEMP/DerivedData"
          PRODUCTS="$DERIVED/Build/Products/Release-iphoneos"

          echo "=== Buscando .app em: $PRODUCTS ==="
          ls -la "$PRODUCTS" 2>/dev/null || {
            echo "Products dir não encontrado. Buscando em todo DerivedData..."
            find "$DERIVED" -name "*.app" -type d 2>/dev/null | grep -v "/Pods/" | head -10
            exit 1
          }

          APP_PATH=$(find "$PRODUCTS" -name "*.app" -maxdepth 1 -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERRO: .app não encontrado em $PRODUCTS"
            find "$PRODUCTS" -maxdepth 3 2>/dev/null | head -30
            exit 1
          fi

          BINARY_NAME=$(basename "$APP_PATH" .app)
          BINARY_PATH="$APP_PATH/$BINARY_NAME"

          echo "App: $APP_PATH"
          echo "Conteúdo do .app:"
          ls -la "$APP_PATH/"

          # Se o binary não está no .app, buscar nos Intermediates e copiar
          if [ ! -f "$BINARY_PATH" ]; then
            echo ""
            echo "Binary ausente no .app — buscando em Intermediates..."
            INTERMEDIATES="$DERIVED/Build/Intermediates.noindex"
            while IFS= read -r candidate; do
              if file "$candidate" 2>/dev/null | grep -qi "mach-o"; then
                echo "Copiando binary de: $candidate"
                cp "$candidate" "$BINARY_PATH"
                chmod +x "$BINARY_PATH"
                break
              fi
            done < <(find "$INTERMEDIATES" -name "$BINARY_NAME" \
              -not -name "*.o" -not -name "*.d" -not -name "*.dia" \
              2>/dev/null | head -10)
          fi

          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERRO: Binary não encontrado nem em Products nem em Intermediates"
            exit 1
          fi

          echo "Binary OK: $(ls -lh "$BINARY_PATH")"

          # Garantir permissões de câmera no Info.plist do .app compilado
          FINAL_PLIST="$APP_PATH/Info.plist"
          echo "=== Injetando chaves no Info.plist final ==="
          inject_plist_key() {
            local key="$1" val="$2"
            /usr/libexec/PlistBuddy -c "Set :$key '$val'" "$FINAL_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :$key string '$val'" "$FINAL_PLIST"
            echo "  $key OK"
          }
          inject_plist_key NSCameraUsageDescription "Necessário para medir caixas com LiDAR"
          inject_plist_key NSMotionUsageDescription "Necessário para rastreamento e medição 3D"
          echo "=== Info.plist final ==="
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$FINAL_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSMotionUsageDescription" "$FINAL_PLIST"

          echo "=== Tamanho do .app antes de zipar ==="
          du -sh "$APP_PATH"
          echo "=== Conteúdo completo do .app ==="
          find "$APP_PATH" -maxdepth 3 | xargs ls -lh 2>/dev/null | head -60

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/MedidorCaixas.app"
          cd "$RUNNER_TEMP"
          zip -r MedidorCaixas.ipa Payload/
          ls -lh MedidorCaixas.ipa
          echo "IPA criado com sucesso!"

      - name: Upload IPA como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MedidorCaixas-iOS
          path: ${{ runner.temp }}/MedidorCaixas.ipa
          retention-days: 30
