name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente com 1 clique

jobs:
  build-ios:
    runs-on: macos-14   # Xcode 15 — mais compatível com Expo SDK 52

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Gerar projeto iOS nativo (prebuild)
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Patch Podfile (Swift 5 + deployment target)
        run: |
          cat >> ios/Podfile << 'EOF'

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['SWIFT_VERSION'] = '5.0'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '17.0'
                config.build_settings['SWIFT_STRICT_CONCURRENCY'] = 'minimal'
              end
            end
          end
          EOF

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          NO_FLIPPER: 1

      - name: Compilar app (sem assinatura)
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace ios/MedidorCaixas.xcworkspace \
            -scheme MedidorCaixas \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR=$RUNNER_TEMP/BuildOutput \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1

      - name: Verificar output e empacotar IPA
        run: |
          echo "=== Conteúdo de BuildOutput ==="
          ls -la $RUNNER_TEMP/BuildOutput/ 2>/dev/null || echo "BuildOutput não existe"

          APP_PATH=$(find $RUNNER_TEMP/BuildOutput -name "*.app" -type d 2>/dev/null \
            | grep -v "\.xctest" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERRO: .app não encontrado. Conteúdo de RUNNER_TEMP:"
            ls -la $RUNNER_TEMP/
            exit 1
          fi

          echo "App encontrado: $APP_PATH"
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP_PATH" $RUNNER_TEMP/Payload/MedidorCaixas.app
          cd $RUNNER_TEMP
          zip -r MedidorCaixas.ipa Payload/
          ls -lh MedidorCaixas.ipa
          echo "IPA criado com sucesso!"

      - name: Upload IPA como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MedidorCaixas-iOS
          path: ${{ runner.temp }}/MedidorCaixas.ipa
          retention-days: 30
