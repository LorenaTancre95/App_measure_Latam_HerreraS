name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Gerar projeto iOS nativo (prebuild)
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Patch Podfile
        run: |
          python3 - << 'PYEOF'
          with open('ios/Podfile', 'r') as f:
              content = f.read()

          patch = """

            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                config.build_settings['OTHER_SWIFT_FLAGS'] = '$(inherited) -strict-concurrency=minimal'
              end
            end
          """

          content = content.replace('post_install do |installer|',
                                    'post_install do |installer|\n' + patch, 1)

          with open('ios/Podfile', 'w') as f:
              f.write(content)

          print('Podfile patched OK')
          PYEOF

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          NO_FLIPPER: 1

      - name: Compilar app (sem assinatura)
        run: |
          xcodebuild build \
            -workspace ios/MedidorCaixas.xcworkspace \
            -scheme MedidorCaixas \
            -configuration Release \
            -sdk iphoneos \
            -jobs 1 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/build.log

      - name: Mostrar erros reais se falhou
        if: failure()
        run: |
          echo "====== ERROS DE COMPILAÇÃO ======"
          grep -E "^/.+:[0-9]+:[0-9]+: error:" /tmp/build.log | head -40 || true
          echo ""
          echo "====== ÚLTIMAS 30 LINHAS ======"
          tail -30 /tmp/build.log

      - name: Verificar output e empacotar IPA
        run: |
          DERIVED=$(find /Users/runner/Library/Developer/Xcode/DerivedData \
            -maxdepth 1 -name "MedidorCaixas-*" -type d 2>/dev/null | head -1)
          echo "DerivedData: $DERIVED"

          APP_PATH=$(find "$DERIVED/Build/Products" \
            -name "MedidorCaixas.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERRO: .app não encontrado"
            ls "$DERIVED/Build/Products/" 2>/dev/null
            exit 1
          fi
          echo "App: $APP_PATH  |  conteúdo: $(ls "$APP_PATH" | tr '\n' ' ')"

          # Com CODE_SIGNING_ALLOWED=NO o binário fica em Intermediates — copiar para o .app
          if [ ! -f "$APP_PATH/MedidorCaixas" ]; then
            echo "Binário ausente no .app — buscando em Intermediates..."
            BINARY=$(find "$DERIVED/Build/Intermediates.noindex" \
              -path "*/Release-iphoneos/MedidorCaixas.build/Objects-normal/arm64/MedidorCaixas" \
              -type f 2>/dev/null | head -1)
            if [ -z "$BINARY" ]; then
              BINARY=$(find "$DERIVED" -name "MedidorCaixas" -type f 2>/dev/null \
                | grep -v "\.app/" | grep -v "\.xctest" | grep -v "\.swiftmodule" | head -1)
            fi
            if [ -z "$BINARY" ]; then
              echo "ERRO: binário não encontrado em Intermediates"
              find "$DERIVED" -name "MedidorCaixas" 2>/dev/null | head -10
              exit 1
            fi
            echo "Binário: $BINARY"
            cp "$BINARY" "$APP_PATH/MedidorCaixas"
            chmod +x "$APP_PATH/MedidorCaixas"
          fi

          echo "Tamanho do .app: $(du -sh "$APP_PATH" | cut -f1)"
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP_PATH" $RUNNER_TEMP/Payload/MedidorCaixas.app
          cd $RUNNER_TEMP
          zip -r MedidorCaixas.ipa Payload/
          ls -lh MedidorCaixas.ipa
          echo "IPA criado com sucesso!"

      - name: Upload IPA como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MedidorCaixas-iOS
          path: ${{ runner.temp }}/MedidorCaixas.ipa
          retention-days: 30
