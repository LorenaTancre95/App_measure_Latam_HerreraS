name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Gerar projeto iOS nativo (prebuild)
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Patch Podfile
        run: |
          python3 - << 'PYEOF'
          with open('ios/Podfile', 'r') as f:
              content = f.read()

          patch = """

            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                config.build_settings['OTHER_SWIFT_FLAGS'] = '$(inherited) -strict-concurrency=minimal'
              end
            end
          """

          content = content.replace('post_install do |installer|',
                                    'post_install do |installer|\n' + patch, 1)

          with open('ios/Podfile', 'w') as f:
              f.write(content)

          print('Podfile patched OK')
          PYEOF

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          NO_FLIPPER: 1

      - name: Compilar app (sem assinatura)
        run: |
          xcodebuild build \
            -workspace ios/MedidorCaixas.xcworkspace \
            -scheme MedidorCaixas \
            -configuration Release \
            -sdk iphoneos \
            -parallelizeTargets NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/build.log

      - name: Mostrar erros reais se falhou
        if: failure()
        run: |
          echo "====== ERROS DE COMPILAÇÃO ======"
          grep -E "^/.+:[0-9]+:[0-9]+: error:" /tmp/build.log | head -40 || true
          echo ""
          echo "====== ÚLTIMAS 30 LINHAS ======"
          tail -30 /tmp/build.log

      - name: Verificar output e empacotar IPA
        run: |
          echo "=== Procurando .app em DerivedData ==="
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "MedidorCaixas.app" -type d 2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERRO: .app não encontrado. DerivedData:"
            ls ~/Library/Developer/Xcode/DerivedData/ 2>/dev/null
            exit 1
          fi

          echo "App encontrado: $APP_PATH"
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP_PATH" $RUNNER_TEMP/Payload/MedidorCaixas.app
          cd $RUNNER_TEMP
          zip -r MedidorCaixas.ipa Payload/
          ls -lh MedidorCaixas.ipa
          echo "IPA criado com sucesso!"

      - name: Upload IPA como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MedidorCaixas-iOS
          path: ${{ runner.temp }}/MedidorCaixas.ipa
          retention-days: 30
